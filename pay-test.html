<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beggar Bot x402 test payment (Base Sepolia)</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:1em auto;padding:0 1em}button{font-size:1.1em;padding:.6em 1em;margin:.3em 0;width:100%}pre{white-space:pre-wrap;word-break:break-all;background:#f4f4f4;padding:.6em;font-size:.8em}</style></head><body>
<h2>x402 test payment — Base Sepolia (testnet USDC)</h2>
<p>Pays <b>0.001 test USDC</b> for one <code>/v1/risk</code> call. Testnet only. You sign a typed message; no gas, nothing on mainnet.</p>
<button id="b1">1. Connect wallet + switch to Base Sepolia</button>
<button id="b2" disabled>2. Get 402 challenge</button>
<button id="b3" disabled>3. Sign &amp; pay</button>
<pre id="log">Open this page in MetaMask's in-app browser.</pre>
<script>
const CHAIN="0x14a34", USDC="0x036CbD53842c5426634e7929541eC2318f3dCF7e";
const API="https://beggar-bot-demand-test.beggarbot.workers.dev/v1/risk?network=base-sepolia&address=0x719227f384b66BFEF00093D6d8d32fA9dC2B40e7";
let acct=null, reqs=null; const L=(m)=>{document.getElementById("log").textContent+="\n"+m;};
const eth=()=>{ if(!window.ethereum) throw new Error("No wallet found. Open in MetaMask in-app browser."); return window.ethereum; };
b1.onclick=async()=>{ try{
  [acct]=await eth().request({method:"eth_requestAccounts"}); L("Account: "+acct);
  try{ await eth().request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]}); }
  catch(e){ if(e.code===4902||/Unrecognized|not added/i.test(e.message||"")) await eth().request({method:"wallet_addEthereumChain",params:[{chainId:CHAIN,chainName:"Base Sepolia",nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18},rpcUrls:["https://sepolia.base.org"],blockExplorerUrls:["https://sepolia.basescan.org"]}]}); else throw e; }
  const c=await eth().request({method:"eth_chainId"}); if(c!==CHAIN) throw new Error("Wrong chain "+c); L("On Base Sepolia (84532)."); b2.disabled=false;
}catch(e){L("Error: "+(e.message||e));}};
b2.onclick=async()=>{ try{
  const r=await fetch(API); const j=await r.json(); L("HTTP "+r.status);
  if(r.status!==402) throw new Error("Expected 402"); reqs=j.accepts[0];
  if(reqs.network!=="base-sepolia"||reqs.asset.toLowerCase()!==USDC.toLowerCase()) throw new Error("Unexpected requirements");
  L("Pay "+(Number(reqs.maxAmountRequired)/1e6)+" USDC to "+reqs.payTo+" on "+reqs.network); b3.disabled=false;
}catch(e){L("Error: "+(e.message||e));}};
b3.onclick=async()=>{ try{
  b3.disabled=true;
  const n=new Uint8Array(32); crypto.getRandomValues(n); const nonce="0x"+[...n].map(x=>x.toString(16).padStart(2,"0")).join("");
  const now=Math.floor(Date.now()/1000);
  const auth={from:acct,to:reqs.payTo,value:reqs.maxAmountRequired,validAfter:String(now-60),validBefore:String(now+reqs.maxTimeoutSeconds),nonce};
  const typed={types:{EIP712Domain:[{name:"name",type:"string"},{name:"version",type:"string"},{name:"chainId",type:"uint256"},{name:"verifyingContract",type:"address"}],
    TransferWithAuthorization:[{name:"from",type:"address"},{name:"to",type:"address"},{name:"value",type:"uint256"},{name:"validAfter",type:"uint256"},{name:"validBefore",type:"uint256"},{name:"nonce",type:"bytes32"}]},
    primaryType:"TransferWithAuthorization",domain:{name:reqs.extra.name,version:reqs.extra.version,chainId:84532,verifyingContract:reqs.asset},message:auth};
  L("Requesting signature...");
  const sig=await eth().request({method:"eth_signTypedData_v4",params:[acct,JSON.stringify(typed)]});
  const xp=btoa(JSON.stringify({x402Version:1,scheme:"exact",network:reqs.network,payload:{signature:sig,authorization:auth}}));
  L("Sending X-PAYMENT...");
  const r=await fetch(API,{headers:{"X-PAYMENT":xp}}); const body=await r.text(); L("HTTP "+r.status+"\n"+body);
  const h=r.headers.get("x-payment-response");
  if(h){ const s=JSON.parse(atob(h)); L("Settled tx: "+s.transaction+"\nhttps://sepolia.basescan.org/tx/"+s.transaction); }
}catch(e){L("Error: "+(e.message||e)); b3.disabled=false;}};
</script></body></html>
